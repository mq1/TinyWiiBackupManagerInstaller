[package]
name = "TinyWiiBackupManagerInstaller"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Manuel Quarneti <mq1@ik.me>"]
license = "GPL-3.0-only"
build = "build.rs"

[package.metadata.winresource]
OriginalFilename = "TinyWiiBackupManagerInstaller.exe"
LegalCopyright = "Copyright © 2026 Manuel Quarneti. Licensed under GPL-3.0-only."

[dependencies]
iced = { version = "0.14", default-features = false, features = [
  "smol",
  "tiny-skia",
] }
minreq = { version = "2", features = ["https"] }
anyhow = "1"
mslnk = "0.1"
directories = "6"
windows-registry = "0.6"
native-dialog = "0.9"
smol = "2"
async_zip = { version = "0.0.18", features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
